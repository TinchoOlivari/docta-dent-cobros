name: CI

on:
  pull_request:
    branches: [main, staging]
  # staging acepta push directo. Sin esto, el CI no lo vería nunca.
  # Avisa, no bloquea: no hay PR donde exigir el check.
  push:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma versión que producción y staging.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctadent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: payment_system.settings.ci
      DB_NAME: doctadent_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: make verify
        run: make verify
