# Cualquier Host que no sea el de staging muere acá.
#
# Sin estos dos bloques, nginx usa el primer `server` como default y el
# pedido llega hasta Django, que responde DisallowedHost. Cada escaneo de
# internet se convierte en un evento de Sentry y un mail.
#
# 444 cierra la conexión sin responder nada.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    # Corta el TLS sin presentar certificado. Para rechazar no hace falta uno.
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name staging.example.com;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.example.com;

    ssl_certificate /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        internal;
        alias /app/media/;
    }

    location / {
        error_page 502 504 = @mantenimiento;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Sendfile-Type X-Accel-Redirect;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location @mantenimiento {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 600 always;
        return 503 '<!doctype html><html lang="es"><meta charset="utf-8"><title>Sistema en mantenimiento</title><body style="font-family:sans-serif;text-align:center;padding:4rem"><h1>Sistema en mantenimiento</h1><p>Volvé a intentar en unos minutos.</p></body></html>';
    }

    client_max_body_size 5M;
}