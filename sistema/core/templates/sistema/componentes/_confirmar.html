<dialog id="{{ id }}" class="modal" aria-labelledby="{{ id }}-titulo">
  <div class="modal-box">
    <h2 id="{{ id }}-titulo" class="text-lg font-semibold">{{ titulo }}</h2>
    <p class="mt-2 text-ink-2">{{ texto }}</p>
    <div data-cuerpo class="mt-3"></div>
    <div class="modal-action flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button type="button" class="btn btn-secundario" data-cerrar autofocus>Volver a editar</button>
      <button type="button" class="btn btn-primary" data-confirmar>{{ boton }}</button>
    </div>
  </div>
</dialog>
