{% extends "admin/change_list.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  #result_list tr.payment-reviewed td,
  #result_list tr.payment-reviewed td a {
    color: #a4a4a4;
  }
</style>
{% endblock %}

{% block result_list %}
{{ block.super }}

{% if user.is_superuser or user.is_administrator %}
<div id="payments-subtotal-footer"
  style="margin-top: 12px; margin-bottom: 12px; padding: 10px; background: var(--darkened-bg); font-size: medium;">
  Subtotal: {{ subtotal_display }}
</div>
{% endif %}

<script>
(function () {
  function clearRowInlineMuted(row) {
    row.querySelectorAll('td span[style*="color"]').forEach(function (span) {
      const parent = span.parentNode;
      while (span.firstChild) {
        parent.insertBefore(span.firstChild, span);
      }
      parent.removeChild(span);
    });
    row.querySelectorAll('td a[style*="color"]').forEach(function (a) {
      a.style.removeProperty('color');
    });
  }

  function setRowReviewed(row, reviewed) {
    if (!row) {
      return;
    }
    row.classList.toggle('payment-reviewed', reviewed);
    if (!reviewed) {
      clearRowInlineMuted(row);
    }
  }

  document.querySelectorAll('.payment-reviewed-toggle').forEach(function (checkbox) {
    setRowReviewed(checkbox.closest('tr'), checkbox.checked);
  });
  document.querySelectorAll('[data-payment-reviewed="1"]').forEach(function (marker) {
    setRowReviewed(marker.closest('tr'), true);
  });

  {% if payment_toggle_reviewed_url %}
  const toggleUrl = "{{ payment_toggle_reviewed_url|escapejs }}";
  const csrfInput = document.querySelector('#changelist-form input[name="csrfmiddlewaretoken"]');
  if (!csrfInput) {
    return;
  }
  const csrfToken = csrfInput.value;

  document.addEventListener('change', function (event) {
    const checkbox = event.target;
    if (!checkbox.classList.contains('payment-reviewed-toggle')) {
      return;
    }

    const paymentId = checkbox.dataset.paymentId;
    const reviewed = checkbox.checked;
    const row = checkbox.closest('tr');
    checkbox.disabled = true;

    const body = new URLSearchParams();
    body.set('payment_id', paymentId);
    body.set('reviewed', reviewed ? 'true' : 'false');

    fetch(toggleUrl, {
      method: 'POST',
      headers: {
        'X-CSRFToken': csrfToken,
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: body.toString(),
      credentials: 'same-origin',
    })
      .then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      })
      .then(function (result) {
        if (!result.ok || !result.data.ok) {
          throw new Error(result.data.error || 'Error al guardar');
        }
        setRowReviewed(row, result.data.reviewed);
      })
      .catch(function () {
        checkbox.checked = !reviewed;
        setRowReviewed(row, checkbox.checked);
        window.alert('No se pudo actualizar el estado de revisado. Intente de nuevo.');
      })
      .finally(function () {
        checkbox.disabled = false;
      });
  });
  {% endif %}
})();
</script>
{% endblock %}
