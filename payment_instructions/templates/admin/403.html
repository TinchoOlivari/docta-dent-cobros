{% extends "admin/base_site.html" %}
{% load i18n %}

{% block title %}Acceso denegado{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; text-align: center;">
    <h1 style="color: #ba2121; margin-bottom: 1em;">Acceso denegado</h1>
    <p style="font-size: 1.1em; margin-bottom: 1.5em;">No tienes acceso a este recurso.</p>
    <p>
        <a href="javascript:history.back()" class="button" style="margin-right: 10px;">← Volver</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'admin:index' %}" class="button">Ir al inicio del admin</a>
        {% endif %}
    </p>
</div>
{% endblock %}
